name: Set up build
description: .NET, Python and the native libraries ACWorldEdit needs (CascLib, from the pinned submodule). Run after checkout with submodules.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        # The game and tests target net8.0; global.json pins the SDK.
        dotnet-version: 8.0.x

    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Resolve pinned native sources
      id: pins
      shell: bash
      run: echo "casclib=$(git rev-parse HEAD:ThirdParty/CascLib)" >> "$GITHUB_OUTPUT"

    # Tools/setup.py stamps its output with the submodule commit and CMake options, so a restored
    # native/win-x64 makes the setup step below skip the CMake build.
    - name: Cache native libraries
      uses: actions/cache@v4
      with:
        path: native/win-x64
        key: native-${{ runner.os }}-${{ steps.pins.outputs.casclib }}-${{ hashFiles('Tools/setup.py') }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Sync submodules and build CascLib
      shell: bash
      run: python Tools/setup.py --no-godot
